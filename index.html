<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CNC Quote System (PDF + OCR)</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; max-width: 960px; }
    #drop { border: 2px dashed #888; padding: 20px; border-radius: 8px; margin-bottom: 12px; background: #fafafa; cursor: pointer; }
    .row { display: flex; gap: 12px; flex-wrap: wrap; margin: 8px 0; align-items: center; }
    label { display: inline-flex; gap: 6px; align-items: center; }
    input[type="number"] { width: 90px; padding: 4px; }
    #file { margin-bottom: 10px; font-weight: bold; }
    #out { border: 1px solid #000; padding: 10px; background: #f0f0f0; white-space: pre-wrap; min-height: 280px; }
    .hint { color: #555; font-size: 13px; margin-top: 6px; }
    #rawWrap { margin-top: 12px; display: none; }
    #raw { border: 1px solid #000; padding: 10px; background: #fbfbfb; white-space: pre-wrap; max-height: 360px; overflow: auto; font-size: 12px; }
  </style>
</head>
<body>
  <h2>CNC Quote System</h2>
  <div id="drop">📄 Drag & Drop PDF Here (or click to pick file)</div>
  <input id="picker" type="file" accept="application/pdf" style="display:none" />
  <div id="file">No file loaded</div>
  <div class="hint">Scanned PDFs are supported with OCR (slower, but more accurate for prints).</div>
  <div class="row">
    <label>Qty: <input id="qty" type="number" value="10" min="1" /></label>
    <label>Material Cost/Part ($): <input id="matCost" type="number" value="25" step="0.01" /></label>
  </div>
  <div class="row">
    <label>OD: <input id="od" type="number" value="2" step="0.001" /></label>
    <label>ID: <input id="id" type="number" value="0" step="0.001" /></label>
    <label>Length: <input id="length" type="number" value="4" step="0.001" /></label>
  </div>
  <div class="row">
    <label><input id="showRaw" type="checkbox" /> Show raw extracted text</label>
  </div>
  <pre id="out">Drop a PDF to begin.</pre>
  <div id="rawWrap">
    <strong>Raw Text Preview (Debug)</strong>
    <pre id="raw">No extracted text yet.</pre>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    const LATHE_RATE = 110;
    const MILL_RATE = 130;
    const PROGRAM_RATE = 120;
    let fileName = "";
    let detected = null;
    let millingOps = 0;
    let lastPdfText = "";
    let lastOcrText = "";
    let lastCombinedText = "";
    const drop = document.getElementById("drop");
    const picker = document.getElementById("picker");
    const out = document.getElementById("out");
    const fileDiv = document.getElementById("file");
    const showRaw = document.getElementById("showRaw");
    const rawWrap = document.getElementById("rawWrap");
    const raw = document.getElementById("raw");
    function volumeRemoved(od, id, len) {
      const ro = od / 2;
      const ri = id / 2;
      return (Math.PI * ro * ro * len) - (Math.PI * ri * ri * len);
    }
    function normalizeText(s) {
      return (s || "")
        .toLowerCase()
        .replace(/[\u2010-\u2015]/g, "-")
        .replace(/[|]/g, " ")
        .replace(/\s+/g, " ")
        .trim();
    }
    function normalizeForOcrKeywords(s) {
      return s
        .replace(/\bm[i1l]{2}[-\s]*w[o0]rk\b/g, "millwork")
        .replace(/\bmi11[-\s]*w[o0]rk\b/g, "millwork")
        .replace(/\bmil[-\s]*w[o0]rk\b/g, "millwork")
        .replace(/\bmill[-\s]*wrk\b/g, "millwork")
        .replace(/\bmilling[-\s]*work\b/g, "millwork");
    }
    function hasMillworkApprox(text) {
      const t = normalizeForOcrKeywords(normalizeText(text));
      // Direct/regex forms
      if (/\b(millwork|mill[-\s]*work|milling|milling[-\s]*op(?:eration)?s?)\b/.test(t)) return true;
      if (/\b(mill|milling)\b/.test(t)) return true;
      // OCR-rough variants like "mil wrk", "mll work"
      if (/\b(m[i1l]{1,3}|mll|mil)\s*(w[o0]?rk|wrk)\b/.test(t)) return true;
      return false;
    }
    function preprocessCanvasForOCR(canvas) {
      const ctx = canvas.getContext("2d");
      const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const d = img.data;
      // Simple grayscale + threshold (helps blueprint/scanned prints)
      for (let i = 0; i < d.length; i += 4) {
        const gray = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
        const bw = gray > 170 ? 255 : 0;
        d[i] = bw;
        d[i + 1] = bw;
        d[i + 2] = bw;
      }
      ctx.putImageData(img, 0, 0);
    }
    function truncateText(s, max = 14000) {
      if (!s) return "";
      if (s.length <= max) return s;
      return s.slice(0, max) + "\n\n[...truncated for display...]";
    }
    function updateRawPreview() {
      if (!showRaw.checked) {
        rawWrap.style.display = "none";
        return;
      }
      rawWrap.style.display = "block";
      raw.textContent =
        "=== PDF TEXT (selectable) ===\n" + (truncateText(lastPdfText) || "(none)") +
        "\n\n=== OCR TEXT ===\n" + (truncateText(lastOcrText) || "(none)") +
        "\n\n=== COMBINED TEXT USED FOR ANALYSIS ===\n" + (truncateText(lastCombinedText) || "(none)");
    }
    async function extractTextFromPdf(pdf) {
      let text = "";
      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const content = await page.getTextContent();
        text += " " + content.items.map((x) => x.str).join(" ");
      }
      return text;
    }
    async function extractTextWithOCR(pdf, statusPrefix = "Running OCR...") {
      let ocrText = "";
      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const viewport = page.getViewport({ scale: 3.0 }); // higher scale improves OCR
        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");
        canvas.width = Math.ceil(viewport.width);
        canvas.height = Math.ceil(viewport.height);
        await page.render({ canvasContext: ctx, viewport }).promise;
        preprocessCanvasForOCR(canvas);
        const result = await Tesseract.recognize(canvas, "eng", {
          logger: (m) => {
            if (m.status === "recognizing text") {
              out.textContent =
                statusPrefix + "\n" +
                "Page " + i + "/" + pdf.numPages + " - " + Math.round(m.progress * 100) + "%";
            }
          },
          tessedit_pageseg_mode: "6"
        });
        ocrText += " " + (result.data.text || "");
      }
      return ocrText;
    }
    function analyzeFeatures(rawText) {
      const lower = normalizeText(rawText);
      const text = normalizeForOcrKeywords(lower);
      const count = (regex) => (text.match(regex) || []).length;
      const has = (regex) => regex.test(text);
      const threadSizeRegex =
        /\b(?:\d+(?:\.\d+)?|\d+\/\d+)-\d+\s*(?:unc|unf|un|acme)?\b/g;
      const threadMatches = text.match(threadSizeRegex) || [];
      const uniqueThreadSizes = [...new Set(threadMatches)];
      const hasAcme = has(/\bacme\b/);
      const hasStub = has(/\bstub\b/);
      const hasStubAcme = has(/\bstub[-\s]*acme\b|\bacme[-\s]*stub\b/);
      millingOps = count(
        /\b(mill|milling|mill[-\s]*work|profile|slot|pocket|face(?:\s*mill)?|keyway|cavity|contour|surface)\b/g
      );
      detected = {
        holes: count(/\b(drill|hole|thru|through)\b/g),
        threads: count(/\b(tap|thread(?:ed|ing)?|unc|unf|acme)\b/g) + uniqueThreadSizes.length,
        threadSize: uniqueThreadSizes.join(", "),
        tpi: (text.match(/\b\d+\s*tpi\b/g) || []).join(", "),
        slots: count(/\b(slot|slt|profile|cut)\b/g),
        pockets: count(/\b(pocket|cavity|remove|clear)\b/g),
        keyways: count(/\b(keyway|key seat)\b/g),
        flats: count(/\bflat(s)?\b/g),
        grooves: count(/\b(groove|undercut)\b/g),
        chamfers: count(/\bchamfer(s)?\b/g),
        pin: has(/\b(pin|external thread|od thread|male thread)\b/),
        box: has(/\b(box|internal thread|id thread|female thread|tap|unc|unf)\b/),
        acme: hasAcme,
        stub: hasStub,
        stubAcme: hasStubAcme,
        tightTol: has(/\.\s*001\b|±\s*0*\.0*01\b/),
        veryTightTol: has(/\.\s*0005\b|±\s*0*\.0*005\b/),
        deepFeatures: has(/\bdeep\b/),
        multiOp: has(/\b(flip|2nd op|second op|multiple setups?)\b/)
      };
      const approxMillwork = hasMillworkApprox(text);
      detected.hasMillwork =
        approxMillwork ||
        millingOps > 0 ||
        detected.slots > 0 ||
        detected.pockets > 0 ||
        detected.keyways > 0 ||
        detected.flats > 0;
    }
    function calculate() {
      if (!fileName || !detected) return;
      const d = detected;
      const holes = d.holes || 0;
      const threads = d.threads || 0;
      const slots = d.slots || 0;
      const pockets = d.pockets || 0;
      const keyways = d.keyways || 0;
      const flats = d.flats || 0;
      const qty = Math.max(1, +document.getElementById("qty").value || 1);
      const matCost = +document.getElementById("matCost").value || 0;
      const od = +document.getElementById("od").value || 0;
      const id = +document.getElementById("id").value || 0;
      const len = +document.getElementById("length").value || 0;
      let lathe = 0.25;
      lathe += volumeRemoved(od, id, len) * 0.02;
      lathe += threads * 0.08;
      if (d.acme) lathe += 0.75;
      if (d.stub) lathe += 0.35;
      if (d.pin) lathe += 0.25;
      if (d.box) lathe += 0.35;
      if (d.stubAcme) lathe += 0.5;
      lathe += (d.grooves || 0) * 0.05;
      lathe += (d.chamfers || 0) * 0.02;
      if (d.tightTol) lathe += 0.25;
      if (d.veryTightTol) lathe += 0.5;
      if (d.multiOp) lathe += 0.4;
      let mill = 0;
      if (d.hasMillwork) {
        mill = 0.4;
        mill += holes * 0.04;
        mill += slots * 0.12;
        mill += pockets * 0.15;
        mill += keyways * 0.08;
        mill += flats * 0.05;
        mill += millingOps * 0.15;
        if (d.deepFeatures) mill += 0.3;
        if (d.tightTol) mill += 0.2;
        if (d.veryTightTol) mill += 0.4;
        if (d.multiOp) mill += 0.5;
      }
      let prog = 0.8;
      prog += threads * 0.1;
      prog += slots * 0.05;
      prog += pockets * 0.08;
      if (d.acme) prog += 0.3;
      if (d.stub) prog += 0.2;
      if (d.box) prog += 0.2;
      if (d.multiOp) prog += 0.4;
      const price = lathe * LATHE_RATE + mill * MILL_RATE + (prog / qty) * PROGRAM_RATE + matCost;
      const total = price * qty;
      out.textContent =
        "File: " + fileName + "\n\n" +
        "Holes: " + holes + "\n" +
        "Threads: " + threads + "\n" +
        "Pin (OD Thread): " + (d.pin ? "YES" : "NO") + "\n" +
        "Box (ID Thread): " + (d.box ? "YES" : "NO") + "\n" +
        "Thread Size: " + (d.threadSize || "N/A") + "\n" +
        "TPI: " + (d.tpi || "N/A") + "\n\n" +
        "ACME: " + (d.acme ? "YES" : "NO") + "\n" +
        "Stub: " + (d.stub ? "YES" : "NO") + "\n" +
        "Stub ACME: " + (d.stubAcme ? "YES" : "NO") + "\n\n" +
        "Millwork Detected: " + (d.hasMillwork ? "YES" : "NO") + "\n" +
        "Slots: " + slots + "\n" +
        "Pockets: " + pockets + "\n" +
        "Keyways: " + keyways + "\n" +
        "Flats: " + flats + "\n" +
        "Milling Ops: " + millingOps + "\n\n" +
        "Lathe Time: " + lathe.toFixed(2) + " hrs\n" +
        "Mill Time: " + mill.toFixed(2) + " hrs\n\n" +
        "Material Cost: $" + matCost.toFixed(2) + "\n\n" +
        "Price/Part: $" + price.toFixed(2) + "\n" +
        "Total: $" + total.toFixed(2);
      updateRawPreview();
    }
    async function processFile(file) {
      try {
        if (!file) return;
        if (!/\.pdf$/i.test(file.name)) {
          out.textContent = "Please load a PDF file.";
          return;
        }
        fileName = file.name;
        fileDiv.textContent = "Loaded: " + fileName;
        out.textContent = "Reading PDF...";
        lastPdfText = "";
        lastOcrText = "";
        lastCombinedText = "";
        updateRawPreview();
        const arrayBuffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
        const pdfText = await extractTextFromPdf(pdf);
        lastPdfText = pdfText;
        // Always run OCR and merge with PDF text (more robust for scanned prints)
        const ocrText = await extractTextWithOCR(pdf, "Running OCR for print feature detection...");
        lastOcrText = ocrText;
        const combined = (pdfText + " " + ocrText).trim();
        if (!combined) {
          out.textContent = "Could not extract text, even with OCR. Try a clearer scan.";
          updateRawPreview();
          return;
        }
        lastCombinedText = combined;
        analyzeFeatures(combined);
        calculate();
      } catch (err) {
        console.error(err);
        out.textContent = "PDF parse error: " + (err && err.message ? err.message : String(err));
      }
    }
    drop.ondragover = (e) => e.preventDefault();
    drop.ondragenter = (e) => e.preventDefault();
    drop.ondrop = async (e) => {
      e.preventDefault();
      const file = e.dataTransfer.files[0];
      await processFile(file);
    };
    drop.onclick = () => picker.click();
    picker.onchange = async (e) => {
      const file = e.target.files[0];
      await processFile(file);
      picker.value = "";
    };
    document.querySelectorAll("input[type='number']").forEach((el) => {
      el.addEventListener("input", calculate);
    });
    showRaw.addEventListener("change", updateRawPreview);
  </script>
</body>
</html>
