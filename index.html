<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>
const LATHE_RATE = 120;
const MILL_RATE = 120;
const PROGRAM_RATE = 100;

let fileName = "";

// VOLUME
function volumeRemoved(od,id,len){
  const ro = od/2;
  const ri = id/2;
  return (Math.PI * ro * ro * len) - (Math.PI * ri * ri * len);
}

const drop = document.getElementById("drop");
const out = document.getElementById("out");
const fileDiv = document.getElementById("file");

drop.ondragover = e => e.preventDefault();

drop.ondrop = async (e) => {
  e.preventDefault();

  const file = e.dataTransfer.files[0];
  if (!file) return;

  fileName = file.name;
  fileDiv.innerText = "Loaded: " + file.name;

  const arrayBuffer = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data: arrayBuffer}).promise;

  let text = "";

  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    text += content.items.map(i => i.str).join(" ");
  }

  // =========================
  // 🔥 CLEAN TEXT (SAFE)
  // =========================
  let lower = text.toLowerCase();

  // fix spacing like 7 . 750 → 7.750
  lower = lower.replace(/(\d)\s*\.\s*(\d)/g, "$1.$2");

  // collapse spaces only (DON’T break words)
  lower = lower.replace(/\s+/g, " ");

  console.log("CLEANED:", lower);

  function count(regex){
    return (lower.match(regex) || []).length;
  }

  // =========================
  // 🔥 THREAD DETECTION (FIXED)
  // =========================
  const threadMatches = lower.match(/\d+\.?\d*\s*-\s*\d+/g) || [];

  const hasAcme = lower.includes("acme");
  const hasStub = lower.includes("stub");

  window.detected = {

    holes: count(/drill|hole|thru|through/g),

    threads: threadMatches.length,
    threadSize: threadMatches.join(", "),
    tpi: (lower.match(/\d+\s*tpi|\d+\s*rd/g) || []).join(", "),

    // FEATURES
    slots: count(/slot|slt|obround/g),
    pockets: count(/pocket|cavity|counterbore|spotface/g),
    keyways: count(/keyway|key seat/g),
    flats: count(/flat/g),

    grooves: count(/groove|undercut/g),
    chamfers: count(/chamfer/g),

    // 🔥 THREAD TYPES (SOLID)
    acme: hasAcme,
    stub: hasStub,
    stubAcme: hasAcme && hasStub,

    // PIN / BOX
    pin: /pin|external|od thread/.test(lower),
    box: /box|internal|id thread|tap/.test(lower),

    // 🔥 STRONG MILL DETECTION
    patternCount: count(/\d+\s*plcs/g),
    slotLike: count(/radius|r\./g),
    profileDims: count(/\d+\.\d{3}/g),

    tightTol: lower.includes(".001"),
    veryTightTol: lower.includes(".0005"),

    deepFeatures: lower.includes("deep"),
    multiOp: lower.includes("flip") || lower.includes("2nd op")
  };

  // 🔥 STRONGER MILL SIGNAL
  window.millingOps = count(/mill|profile|slot|pocket|face|drill/g);

  calculate();
};

// =========================
// CALC
// =========================
function calculate(){

  if(!fileName) return;

  const d = window.detected;

  const holes = d.holes || 0;
  const threads = d.threads || 0;

  const slots = d.slots || 0;
  const pockets = d.pockets || 0;
  const keyways = d.keyways || 0;
  const flats = d.flats || 0;

  const qty = +document.getElementById("qty").value;
  const matCost = +document.getElementById("matCost").value;

  const od = +document.getElementById("od").value;
  const id = +document.getElementById("id").value;
  const len = +document.getElementById("length").value;

  // =========================
  // LATHE
  // =========================
  let lathe = 0;

  const hasLathe =
    threads > 0 ||
    d.acme ||
    d.stub ||
    d.grooves > 0 ||
    d.chamfers > 0 ||
    volumeRemoved(od,id,len) > 0.1;

  if (hasLathe) {
    lathe = 0.25;

    lathe += volumeRemoved(od,id,len) * 0.02;
    lathe += threads * 0.08;

    // 🔥 THREAD COST
    if(d.stubAcme){
      lathe += 1.2;
    } else {
      if(d.acme) lathe += 0.8;
      if(d.stub) lathe += 0.4;
    }

    if(d.pin) lathe += 0.25;
    if(d.box) lathe += 0.35;

    lathe += d.grooves * 0.05;
    lathe += d.chamfers * 0.02;

    if(d.tightTol) lathe += 0.25;
    if(d.veryTightTol) lathe += 0.5;
    if(d.multiOp) lathe += 0.4;
  }

  // =========================
  // MILL (FIXED)
  // =========================
  let mill = 0;

  const hasMill =
    holes > 0 ||
    slots > 0 ||
    pockets > 0 ||
    keyways > 0 ||
    flats > 0 ||
    d.patternCount > 0 ||
    d.slotLike > 0 ||
    d.profileDims > 3;

  if (hasMill) {

    mill = 0.5; // higher base

    mill += holes * 0.05;
    mill += slots * 0.15;
    mill += pockets * 0.18;
    mill += keyways * 0.1;
    mill += flats * 0.08;

    mill += (window.millingOps || 0) * 0.2;
    mill += d.patternCount * 0.15;
    mill += d.slotLike * 0.08;
    mill += d.profileDims * 0.02;

    // 🔥 FORCE TRIGGER FOR SLOT PATTERNS (YOUR CASE)
    if (d.patternCount >= 2 && d.slotLike >= 2) {
      mill += 1.5;
    }

    if (d.profileDims > 8) {
      mill += 0.8;
    }

    if(d.deepFeatures) mill += 0.3;
    if(d.tightTol) mill += 0.2;
    if(d.veryTightTol) mill += 0.4;
    if(d.multiOp) mill += 0.5;
  }

  // =========================
  // PROGRAM
  // =========================
  let prog = 0.8;

  prog += threads * 0.1;
  prog += slots * 0.05;
  prog += pockets * 0.08;

  if(d.acme) prog += 0.3;
  if(d.stub) prog += 0.2;
  if(d.box) prog += 0.2;
  if(d.multiOp) prog += 0.4;

  // =========================
  // MATERIAL
  // =========================
  const materialWithMarkup = matCost * 1.25;

  const price =
    lathe * LATHE_RATE +
    mill * MILL_RATE +
    (prog / qty) * PROGRAM_RATE +
    materialWithMarkup;

  const total = price * qty;

  // =========================
  // OUTPUT
  // =========================
  out.textContent =
    "File: " + fileName + "\n\n" +

    "Lathe Work: " + (lathe > 0 ? "YES" : "NO") + "\n" +
    "Mill Work: " + (mill > 0 ? "YES" : "NO") + "\n\n" +

    "Threads: " + threads + "\n" +
    "Thread Size: " + (d.threadSize || "N/A") + "\n" +
    "Stub ACME: " + (d.stubAcme ? "YES" : "NO") + "\n\n" +

    "Slots: " + slots + "\n" +
    "Pockets: " + pockets + "\n" +
    "Pattern Count: " + d.patternCount + "\n\n" +

    "Lathe Time: " + lathe.toFixed(2) + " hrs\n" +
    "Mill Time: " + mill.toFixed(2) + " hrs\n\n" +

    "Price/Part: $" + price.toFixed(2) + "\n" +
    "Total: $" + total.toFixed(2);
}

// AUTO UPDATE
document.querySelectorAll("input").forEach(el => {
  el.oninput = calculate;
});
</script>
