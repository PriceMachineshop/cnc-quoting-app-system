<!DOCTYPE html>
<html>
<head>
  <title>CNC Quote System</title>
</head>
<body>

<h2>CNC Quote System (WORKING)</h2>

<input type="file" id="fileInput" accept=".pdf"><br><br>

Qty:
<input id="qty" type="number" value="10"><br><br>

Material ($/part):
<input id="matCost" type="number" value="25"><br><br>

OD:
<input id="od" type="number" value="2">

ID:
<input id="id" type="number" value="0">

Length:
<input id="length" type="number" value="4"><br><br>

<pre id="out" style="border:1px solid #000;padding:10px;"></pre>

<script src="pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = "";

const fileInput = document.getElementById("fileInput");
const out = document.getElementById("out");

let detected = {};
let fileName = "";

// FILE SELECT
fileInput.onchange = (e) => {
  const file = e.target.files[0];
  if (file) {
    handleFile(file);
  }
};

// MAIN FILE HANDLER
function handleFile(file){

  fileName = file.name;
  out.textContent = "Reading PDF...\n";

  const reader = new FileReader();

  reader.onload = async function () {
    try {
      const data = new Uint8Array(this.result);

      const pdf = await pdfjsLib.getDocument({
        data: data,
        disableWorker: true
      }).promise;

      const page = await pdf.getPage(1);
      const viewport = page.getViewport({ scale: 2 });

      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");

      canvas.width = viewport.width;
      canvas.height = viewport.height;

      await page.render({
        canvasContext: ctx,
        viewport: viewport
      }).promise;

      out.textContent = "Running OCR...\n";

      const result = await Tesseract.recognize(canvas, "eng");

      const text = result.data.text;
      const lower = text.toLowerCase();

      // DETECTION
      let threads = 0;
      let holes = 0;

      threads += (lower.match(/unc/g) || []).length;
      threads += (lower.match(/unf/g) || []).length;
      threads += (lower.match(/acme/g) || []).length;
      threads += (lower.match(/stub/g) || []).length;
      threads += (lower.match(/tap/g) || []).length;

      holes += (lower.match(/drill/g) || []).length;
      holes += (lower.match(/bore/g) || []).length;
      holes += (lower.match(/thru/g) || []).length;

      detected = {
        threads,
        holes,
        acme: lower.includes("acme"),
        stub: lower.includes("stub"),
        box: lower.includes("box"),
        tapped: lower.includes("tap")
      };

      calculate(text);

    } catch (err) {
      out.textContent = "ERROR: " + err.message;
    }
  };

  reader.readAsArrayBuffer(file);
}

// VOLUME
function volumeRemoved(od,id,len){
  const ro = od/2;
  const ri = id/2;
  return (Math.PI * ro * ro * len) - (Math.PI * ri * ri * len);
}

// CALCULATE
function calculate(ocrText){

  if(!detected || detected.threads === undefined){
    out.textContent = "⚠️ Load a PDF first";
    return;
  }

  const qty = +document.getElementById("qty").value || 1;
  const matCost = +document.getElementById("matCost").value || 0;

  const od = +document.getElementById("od").value || 0;
  const id = +document.getElementById("id").value || 0;
  const len = +document.getElementById("length").value || 0;

  const vol = volumeRemoved(od,id,len);

  let lathe = 0.3 + vol * 0.02;

  if(detected.threads) lathe += detected.threads * 0.1;
  if(detected.acme) lathe += 1.2;
  if(detected.stub) lathe += 0.6;
  if(detected.box) lathe += 0.5;
  if(detected.tapped) lathe += 0.3;

  let mill = 0.5 + (detected.holes || 0) * 0.05;

  const prog = 1.2;

  const price =
    lathe * 120 +
    mill * 120 +
    (prog / qty) * 100 +
    matCost;

  const total = price * qty;

  out.textContent =
    "File: " + fileName + "\n\n" +

    "Threads: " + detected.threads + "\n" +
    "Holes: " + detected.holes + "\n" +
    "ACME: " + (detected.acme ? "YES" : "NO") + "\n" +
    "Stub: " + (detected.stub ? "YES" : "NO") + "\n\n" +

    "Lathe Time: " + lathe.toFixed(2) + " hrs\n" +
    "Mill Time: " + mill.toFixed(2) + " hrs\n\n" +

    "Price/Part: $" + price.toFixed(2) + "\n" +
    "Total: $" + total.toFixed(2) + "\n\n" +

    "------ OCR TEXT ------\n" +
    (ocrText || "");
}

// AUTO UPDATE
document.querySelectorAll("input").forEach(el => {
  el.oninput = () => {
    if(detected && detected.threads !== undefined){
      calculate();
    }
  };
});
</script>

</body>
</html>
