<script>
const drop = document.getElementById("drop");
const out = document.getElementById("out");

drop.ondragover = e => e.preventDefault();

drop.ondrop = (e) => {
  e.preventDefault();
  const file = e.dataTransfer.files[0];

  const price = 75;

  out.textContent =
    "File: " + file.name +
    "\\nPrice/Part: $" + price;
};
</script>

</body>
</html>
