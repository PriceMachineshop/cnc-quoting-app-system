<!DOCTYPE html>
<html>
<head>
  <title>CNC Quote System</title>
</head>
<body>

<h2>CNC Quote System (OCR Debug)</h2>

<div id="drop" style="border:3px dashed red;padding:30px;">
  📄 DROP PDF HERE
</div>

<div id="file"></div>

<br>

Qty:
<input id="qty" type="number" value="10"><br><br>

Material Cost:
<input id="matCost" type="number" value="25"><br><br>

OD:
<input id="od" type="number" value="2">

ID:
<input id="id" type="number" value="0">

Length:
<input id="length" type="number" value="4"><br><br>

<pre id="out"></pre>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = "";

const drop = document.getElementById("drop");
const out = document.getElementById("out");
const fileDiv = document.getElementById("file");

drop.ondragover = (e) => {
  e.preventDefault();
  drop.style.background = "#ddd";
};

drop.ondragleave = () => {
  drop.style.background = "";
};

// 🚀 MAIN DROP
drop.ondrop = (e) => {
  e.preventDefault();
  drop.style.background = "";

  out.textContent = "DROP DETECTED\n";

  const file = e.dataTransfer.files[0];

  if (!file) {
    out.textContent += "❌ No file found";
    return;
  }

  fileDiv.innerText = "Loaded: " + file.name;

  out.textContent += "Reading file...\n";

  const reader = new FileReader();

  reader.onload = async function () {

    out.textContent += "File loaded into memory\n";

    try {
      const data = new Uint8Array(this.result);

      out.textContent += "Opening PDF...\n";

      const pdf = await pdfjsLib.getDocument({
        data: data,
        disableWorker: true
      }).promise;

      out.textContent += "PDF opened\n";

      const page = await pdf.getPage(1);

      out.textContent += "Rendering page...\n";

      const viewport = page.getViewport({ scale: 2 });

      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");

      canvas.width = viewport.width;
      canvas.height = viewport.height;

      await page.render({
        canvasContext: ctx,
        viewport: viewport
      }).promise;

      out.textContent += "Running OCR...\n";

      const result = await Tesseract.recognize(canvas, "eng");

      const text = result.data.text;

      out.textContent += "\n--- OCR RESULT ---\n";
      out.textContent += text;

    } catch (err) {
      out.textContent += "\n❌ ERROR:\n" + err.message;
    }
  };

  reader.readAsArrayBuffer(file);
};
</script>

</body>
</html>
