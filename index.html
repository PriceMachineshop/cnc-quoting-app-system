<!DOCTYPE html>
<html>
<head>
  <title>Price Machine Quote OCR System</title>
</head>
<body>

<h2>Price Machine Quote System (OCR + Pricing)</h2>

<div id="drop" style="border:3px dashed green;padding:30px;">
  📄 DROP PDF HERE
</div>

<div id="file"></div>

<br>

Qty:
<input id="qty" type="number" value="10"><br><br>

Material Cost ($ per part):
<input id="matCost" type="number" value="25"><br><br>

OD:
<input id="od" type="number" value="2">

ID:
<input id="id" type="number" value="0">

Length:
<input id="length" type="number" value="4"><br><br>

<pre id="out"></pre>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>

<script>
const LATHE_RATE = 120;
const MILL_RATE = 120;
const PROGRAM_RATE = 100;

let fileName = "";
let detected = {};

// MATERIAL REMOVAL
function volumeRemoved(od,id,len){
  const ro = od/2;
  const ri = id/2;
  return (Math.PI * ro * ro * len) - (Math.PI * ri * ri * len);
}

const drop = document.getElementById("drop");
const out = document.getElementById("out");
const fileDiv = document.getElementById("file");

// DRAG
drop.ondragover = (e) => {
  e.preventDefault();
  drop.style.background = "#ddd";
};

drop.ondragleave = () => {
  drop.style.background = "";
};

// DROP
drop.ondrop = async (e) => {
  e.preventDefault();
  drop.style.background = "";

  const file = e.dataTransfer.files[0];
  if (!file) return;

  fileName = file.name;
  fileDiv.innerText = "Loaded: " + file.name;

  try {
    out.textContent = "Running OCR...\n";

    const result = await Tesseract.recognize(file, "eng");

    const text = result.data.text;
    const lower = text.toLowerCase();

    console.log("OCR TEXT:", text);

    // 🔥 DETECTION
    let threads = 0;
    let holes = 0;

    threads += (lower.match(/unc/g) || []).length;
    threads += (lower.match(/unf/g) || []).length;
    threads += (lower.match(/acme/g) || []).length;
    threads += (lower.match(/stub/g) || []).length;
    threads += (lower.match(/tap/g) || []).length;

    holes += (lower.match(/drill/g) || []).length;
    holes += (lower.match(/bore/g) || []).length;
    holes += (lower.match(/thru/g) || []).length;

    detected = {
      threads,
      holes,
      acme: lower.includes("acme"),
      stub: lower.includes("stub"),
      box: lower.includes("box"),
      tapped: lower.includes("tap"),
      tolerance:
        lower.includes("±") ||
        lower.includes("+/-") ||
        lower.includes(".00")
    };

  function calculate(ocrText){

  if(!detected || detected.threads === undefined){
    out.textContent = "⚠️ Load a PDF first";
    return;
  }

  const qty = +document.getElementById("qty").value || 1;
  const matCost = +document.getElementById("matCost").value || 0;

  const od = +document.getElementById("od").value || 0;
  const id = +document.getElementById("id").value || 0;
  const len = +document.getElementById("length").value || 0;

  const vol = volumeRemoved(od,id,len);

  let lathe = 0.3 + vol * 0.02;

  if(detected.threads) lathe += detected.threads * 0.1;
  if(detected.acme) lathe += 1.2;
  if(detected.stub) lathe += 0.6;
  if(detected.box) lathe += 0.5;
  if(detected.tapped) lathe += 0.3;
  if(detected.tolerance) lathe += 0.4;

  let mill = 0.5 + (detected.holes || 0) * 0.05;

  const prog = 1.2;

  const price =
    lathe * LATHE_RATE +
    mill * MILL_RATE +
    (prog / qty) * PROGRAM_RATE +
    matCost;

  const total = price * qty;

  out.textContent =
    "File: " + fileName + "\n\n" +

    "Threads: " + detected.threads + "\n" +
    "Holes: " + detected.holes + "\n" +
    "ACME: " + (detected.acme ? "YES" : "NO") + "\n" +
    "Stub: " + (detected.stub ? "YES" : "NO") + "\n" +
    "Box: " + (detected.box ? "YES" : "NO") + "\n\n" +

    "Lathe Time: " + lathe.toFixed(2) + " hrs\n" +
    "Mill Time: " + mill.toFixed(2) + " hrs\n\n" +

    "Material: $" + matCost.toFixed(2) + "\n\n" +

    "PRICE PER PART: $" + price.toFixed(2) + "\n" +
    "TOTAL: $" + total.toFixed(2) + "\n\n" +

    (ocrText ? "------ OCR TEXT ------\n" + ocrText : "");
}

// AUTO UPDATE
document.querySelectorAll("input").forEach(el => {
  el.oninput = () => {
  if(detected && detected.threads !== undefined){
    calculate();
  }
};
});
</script>

</body>
</html>
