<!DOCTYPE html>
<html>
<head>
  <title>CNC Quote System</title>
</head>
<body>

<h2>CNC Quote System</h2>

<div id="drop" style="border:2px dashed #888;padding:20px;">
  📄 Drag & Drop PDF Here
</div>

<div id="file"></div>

<br>

Qty:
<input id="qty" type="number" value="10"><br><br>

Material Cost (per part $):
<input id="matCost" type="number" value="25"><br><br>

OD:
<input id="od" type="number" value="2">

ID:
<input id="id" type="number" value="0">

Length:
<input id="length" type="number" value="4"><br><br>

<pre id="out" style="border:1px solid #000;padding:10px;background:#f0f0f0;"></pre>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>
const LATHE_RATE = 110;
const MILL_RATE = 130;
const PROGRAM_RATE = 120;

let fileName = "";

// VOLUME
function volumeRemoved(od,id,len){
  const ro = od/2;
  const ri = id/2;
  return (Math.PI * ro * ro * len) - (Math.PI * ri * ri * len);
}

// ELEMENTS
const drop = document.getElementById("drop");
const out = document.getElementById("out");
const fileDiv = document.getElementById("file");

// DRAG
drop.ondragover = e => e.preventDefault();

// DROP (FIXED)
drop.ondrop = async (e) => {
  e.preventDefault();

  const file = e.dataTransfer.files[0];
  if (!file) return;

  fileName = file.name;
  fileDiv.innerText = "Loaded: " + file.name;

  // READ PDF
  const arrayBuffer = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data: arrayBuffer}).promise;

  let text = "";

  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    text += content.items.map(i => i.str).join(" ");
  }

  const lower = text.toLowerCase();
  const txt = lower;
  
// HELPERS
function count(regex){
  return (txt.match(regex) || []).length;
}

window.detected = {
  const millingOps = count(/mill|profile|slot|pocket|cut|face/g);

  // HOLES (drilled or tapped)
  holes: count(/drill|hole|thru|through/g),

  // THREADS (tap / thread callouts)
  threads: count(/tap|thread|\d+-\d+/g),

  // MILL FEATURES
  slots: count(/slot|slt|mill|profile|cut/g),
  pockets: count(/pocket|cavity|remove|clear/g),
  keyways: count(/keyway|key seat|key/g),
  flats: count(/flat/g),

  // TURNING FEATURES
  grooves: count(/groove|undercut/g),
  chamfers: count(/chamfer/g),

  // THREAD TYPES
  acme: txt.includes("acme"),
  stub: txt.includes("stub"),
  pitch: txt.includes("pitch"),

  // COMPLEXITY FLAGS
  tightTol: txt.includes("±.001") || txt.includes(".001") || txt.includes("tight"),
  veryTightTol: txt.includes("±.0005") || txt.includes(".0005"),

  // DEPTH / MULTI-OP CLUES
  deepFeatures: txt.includes("deep"),
  multiOp: txt.includes("flip") || txt.includes("2nd op")
};

  calculate();
};

// CALC
function calculate(){

  if(!fileName) return;

  const holes = window.detected?.holes || 0;
  const threads = window.detected?.threads || 0;
  const acme = window.detected?.acme;
  const stub = window.detected?.stub;
  const tolerance = window.detected?.tolerance;

  const qty = +document.getElementById("qty").value;
  const matCost = +document.getElementById("matCost").value;

  const od = +document.getElementById("od").value;
  const id = +document.getElementById("id").value;
  const len = +document.getElementById("length").value;

  // LATHE
  let lathe = 0.25;

// material removal drives base time
lathe += volumeRemoved(od,id,len) * 0.02;

// threads
lathe += window.detected.threads * 0.08;

// acme / stub threads are expensive
if(window.detected.acme) lathe += 0.75;
if(window.detected.stub) lathe += 0.35;

// grooves & chamfers
lathe += window.detected.grooves * 0.05;
lathe += window.detected.chamfers * 0.02;

// tolerance impact
if(window.detected.tightTol) lathe += 0.25;
if(window.detected.veryTightTol) lathe += 0.5;

// multi-op penalty
if(window.detected.multiOp) lathe += 0.4;

  // 🔥 FIXED MILL (THIS WAS YOUR PROBLEM)
  const slots = window.detected?.slots || 0;
const pockets = window.detected?.pockets || 0;
const keyways = window.detected?.keyways || 0;
const flats = window.detected?.flats || 0;

// MILL TIME
let mill = 0.4;

// base features
mill += holes * 0.04;
mill += slots * 0.12;
mill += pockets * 0.15;
mill += keyways * 0.08;
mill += flats * 0.05;
mill += millingOps * 0.15;

// complexity bump
if(window.detected.deepFeatures) mill += 0.3;

// tolerance impact
if(window.detected.tightTol) mill += 0.2;
if(window.detected.veryTightTol) mill += 0.4;

// multi-op setups
if(window.detected.multiOp) mill += 0.5;

  // PROGRAM
 let prog = 0.8;

// complexity adds programming
prog += (window.detected.threads * 0.1);
prog += (window.detected.slots * 0.05);
prog += (window.detected.pockets * 0.08);

if(window.detected.acme) prog += 0.5;
if(window.detected.multiOp) prog += 0.4;
  // PRICE
  const price = (
    lathe * LATHE_RATE +
    mill * MILL_RATE +
    (prog / qty) * PROGRAM_RATE +
    matCost
  );

  const total = price * qty;

  // OUTPUT
  out.textContent =
    "File: " + fileName + "\n\n" +
    
    "Holes: " + holes + "\n" +
    "Threads: " + threads + "\n" +
    "Tapped: " + tapped + "\n" +
    "ACME: " + (acme ? "YES" : "NO") + "\n" +
    "Stub: " + (stub ? "YES" : "NO") + "\n" +
    "Tolerance: " + (tolerance ? "YES" : "NO") + "\n\n" +
    "Slots: " + slots + "\n" +
    "Pockets: " + pockets + "\n" +
    "Keyways: " + keyways + "\n" +
    "Flats: " + flats + "\n\n" +
    "Milling Ops: " + millingOps + "\n\n" +
    "Lathe Time: " + lathe.toFixed(2) + " hrs\n" +
    "Mill Time: " + mill.toFixed(2) + " hrs\n\n" +
    "Slots: " + window.detected.slots + "\n" +
    "Pockets: " + window.detected.pockets + "\n" +
    "Keyways: " + window.detected.keyways + "\n" +
    "Grooves: " + window.detected.grooves + "\n\n" +

    "Material Cost: $" + matCost.toFixed(2) + "\n\n" +

    "Price/Part: $" + price.toFixed(2) + "\n" +
    "Total: $" + total.toFixed(2);
}

// AUTO UPDATE
document.querySelectorAll("input").forEach(el => {
  el.oninput = calculate;
});
</script>

</body>
</html>
