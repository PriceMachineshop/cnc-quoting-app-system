<!DOCTYPE html>
<html>
<head>
  <title>CNC Quote System</title>
</head>
<body>

<h2>CNC Quote System</h2>

<div id="drop" style="border:2px dashed #888;padding:20px;">
  📄 Drag & Drop PDF Here
</div>

<div id="file"></div>

<br>

Qty:
<input id="qty" type="number" value="10"><br><br>

Material Cost (per part $):
<input id="matCost" type="number" value="25"><br><br>

OD:
<input id="od" type="number" value="2">
ID:
<input id="id" type="number" value="0">
Length:
<input id="length" type="number" value="4"><br><br>

<pre id="out" style="border:1px solid #000;padding:10px;background:#f0f0f0;"></pre>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>
const LATHE_RATE = 110;
const MILL_RATE = 130;
const PROGRAM_RATE = 120;

let fileName = "";

// VOLUME
function volumeRemoved(od,id,len){
  const ro = od/2;
  const ri = id/2;
  return (Math.PI * ro * ro * len) - (Math.PI * ri * ri * len);
}

// ELEMENTS
const drop = document.getElementById("drop");
const out = document.getElementById("out");
const fileDiv = document.getElementById("file");

// DRAG
drop.ondragover = e => e.preventDefault();

// DROP
drop.ondrop = async (e) => {
  e.preventDefault();

  const file = e.dataTransfer.files[0];
  if (!file) return;

  fileName = file.name;
  fileDiv.innerText = "Loaded: " + file.name;

  const arrayBuffer = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data: arrayBuffer}).promise;

  let text = "";

  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    text += content.items.map(i => i.str).join(" ");
  }

  const lower = text.toLowerCase();

  function count(regex){
    return (lower.match(regex) || []).length;
  }

  // 🔥 STRONG THREAD REGEX (handles real prints)
  const threadRegex = /[ø]?\s*\d*\.?\d+\s*-\s*\d+\s*(unc|unf|un)?-?\d*[ab]?/g;

  window.detected = {

    holes: count(/drill|hole|thru|through/g),

    threads: (lower.match(threadRegex) || []).length,
    patternCount: count(/\d+\s*plcs/g),
    slotLike: count(/r\s*\.\d+|radius/g),
   profileDims: count(/\d+\.\d{3}/g),

   threadSize: (lower.match(threadRegex) || []).join(", "),
   tpi: (lower.match(/\d+\s*tpi/g) || []).join(", "),
    threadSize: (lower.match(threadRegex) || []).join(", "),
    tpi: (lower.match(/\d+\s*tpi/g) || []).join(", "),

    slots: count(/slot|slt|mill|profile|cut/g),
    pockets: count(/pocket|cavity|remove|clear/g),
    keyways: count(/keyway|key seat|key/g),
    flats: count(/flat/g),

    grooves: count(/groove|undercut/g),
    chamfers: count(/chamfer/g),

    acme: /acme/.test(lower),
    stub: /stub/.test(lower),

    // 🔥 catch combined cases like "7.750-4 STUB ACME"
    stubAcme: /stub\s*acme/.test(lower) || /acme\s*stub/.test(lower),

    pin: /pin|external|od thread/.test(lower),
    box: /box|internal|id thread|tap|unc|unf/.test(lower),

    tightTol: lower.includes(".001"),
    veryTightTol: lower.includes(".0005"),

    deepFeatures: lower.includes("deep"),
    multiOp: lower.includes("flip") || lower.includes("2nd op")
  };

  window.millingOps = count(/mill|profile|slot|pocket|cut|face/g);

  calculate();
};

// CALC
function calculate(){

  if(!fileName) return;

  const d = window.detected;

  const holes = d.holes || 0;
  const threads = d.threads || 0;
  const slots = d.slots || 0;
  const pockets = d.pockets || 0;
  const keyways = d.keyways || 0;
  const flats = d.flats || 0;

  const qty = +document.getElementById("qty").value;
  const matCost = +document.getElementById("matCost").value;

  const od = +document.getElementById("od").value;
  const id = +document.getElementById("id").value;
  const len = +document.getElementById("length").value;

  // ----------------------
  // LATHE AUTO DETECT
  // ----------------------
  const hasLatheWork =
    threads > 0 ||
    d.acme ||
    d.stub ||
    d.pin ||
    d.box ||
    d.grooves > 0 ||
    d.chamfers > 0 ||
    id > 0;

  let lathe = 0;

  if (hasLatheWork) {
    lathe = 0.25;

    lathe += volumeRemoved(od,id,len) * 0.02;
    lathe += threads * 0.08;

   // THREAD TYPE INTELLIGENCE (FIXED)
   if(d.stubAcme){
   lathe += 1.1;   // heavy cut, slow feed, real shop time
   } else {
   if(d.acme) lathe += 0.75;
   if(d.stub) lathe += 0.35;
   }

    if(d.pin) lathe += 0.25;
    if(d.box) lathe += 0.35;

    if(d.acme && d.stub) lathe += 0.5;

    lathe += d.grooves * 0.05;
    lathe += d.chamfers * 0.02;

    if(d.tightTol) lathe += 0.25;
    if(d.veryTightTol) lathe += 0.5;
    if(d.multiOp) lathe += 0.4;
    const hasLathe =
    threads > 0 ||
    d.acme ||
    d.stub ||
    d.stubAcme ||
    d.grooves > 0 ||
    d.chamfers > 0 ||
    volumeRemoved(od,id,len) > 0.1;

    if (!hasLathe) lathe = 0;
    }

  // ----------------------
  // MILL AUTO DETECT
  // ----------------------
  const hasMillWork =
    holes > 0 ||
    slots > 0 ||
    pockets > 0 ||
    keyways > 0 ||
    flats > 0 ||
    (window.millingOps || 0) > 0;

  let mill = 0;

// only turn on mill if features exist
const hasMill =
  (window.millingOps > 0) ||
  d.patternCount > 0 ||
  d.slotLike > 3;

// 👇 THIS FIXES BOTH PROBLEMS
if (hasMill) {

  mill = 0.4;

  mill += holes * 0.04;
  mill += slots * 0.12;
  mill += pockets * 0.15;
  mill += keyways * 0.08;
  mill += flats * 0.05;

  mill += (window.millingOps || 0) * 0.15;

  // 🔥 NEW INTELLIGENCE
  mill += d.patternCount * 0.12;   // repeated features = slots
  mill += d.slotLike * 0.05;       // radii/obrounds

  if(d.deepFeatures) mill += 0.3;
  if(d.tightTol) mill += 0.2;
  if(d.veryTightTol) mill += 0.4;
  if(d.multiOp) mill += 0.5;

} else {
  mill = 0; // 🔥 no ghost charges
}

  // ----------------------
  // PROGRAM
  // ----------------------
  let prog = 0.8;

  prog += threads * 0.1;
  prog += slots * 0.05;
  prog += pockets * 0.08;

  if(d.acme) prog += 0.3;
  if(d.stub) prog += 0.2;
  if(d.box) prog += 0.2;
  if(d.multiOp) prog += 0.4;

  // ----------------------
  // MATERIAL MARKUP
  // ----------------------
  const materialWithMarkup = matCost * 1.25;

  const price =
    lathe * LATHE_RATE +
    mill * MILL_RATE +
    (prog / qty) * PROGRAM_RATE +
    materialWithMarkup;

  const total = price * qty;

  // OUTPUT
  out.textContent =
    "File: " + fileName + "\n\n" +

    "Lathe Work: " + (hasLatheWork ? "YES" : "NO") + "\n" +
    "Mill Work: " + (hasMillWork ? "YES" : "NO") + "\n\n" +

    "Holes: " + holes + "\n" +
    "Threads: " + threads + "\n" +
    "Pin (OD Thread): " + (d.pin ? "YES" : "NO") + "\n" +
    "Box (ID Thread): " + (d.box ? "YES" : "NO") + "\n" +
    "Thread Size: " + (d.threadSize || "N/A") + "\n" +
    "TPI: " + (d.tpi || "N/A") + "\n\n" +

    "ACME: " + (d.acme ? "YES" : "NO") + "\n" +
    "Stub: " + (d.stub ? "YES" : "NO") + "\n\n" +

    "Slots: " + slots + "\n" +
    "Pockets: " + pockets + "\n" +
    "Keyways: " + keyways + "\n" +
    "Flats: " + flats + "\n" +
    "Milling Ops: " + (window.millingOps || 0) + "\n\n" +

    "Lathe Time: " + lathe.toFixed(2) + " hrs\n" +
    "Mill Time: " + mill.toFixed(2) + " hrs\n\n" +

    "Material Cost (Base): $" + matCost.toFixed(2) + "\n" +
    "Material w/Markup (1.25x): $" + materialWithMarkup.toFixed(2) + "\n\n" +

    "Price/Part: $" + price.toFixed(2) + "\n" +
    "Total: $" + total.toFixed(2);
}

// AUTO UPDATE
document.querySelectorAll("input").forEach(el => {
  el.oninput = calculate;
});
</script>

</body>
</html>
