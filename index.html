<!DOCTYPE html>
<html>
<head>
  <title>CNC Quote System</title>
</head>
<body>

<h2>CNC Quote System</h2>

<div id="drop" style="border:2px dashed #888;padding:20px;">
  📄 Drag & Drop PDF Here
</div>

<div id="file"></div>

<br>

Qty:
<input id="qty" type="number" value="10"><br><br>

Material Cost (per part $):
<input id="matCost" type="number" value="25"><br><br>

Stock OD:
<input id="od" type="number" value="2">

Final ID:
<input id="id" type="number" value="0">

Length:
<input id="length" type="number" value="4"><br><br>

<pre id="out" style="border:1px solid #000;padding:10px;background:#f0f0f0;"></pre>

<!-- ✅ FIXED PDF.JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>
const LATHE_RATE = 110;
const MILL_RATE = 130;
const PROGRAM_RATE = 120;

let fileName = "";

// 🔧 FIX: disable worker (CRITICAL for Electron)
pdfjsLib.GlobalWorkerOptions.workerSrc = "";

// MATERIAL REMOVAL
function volumeRemoved(od,id,len){
  const ro = od/2;
  const ri = id/2;
  return (Math.PI * ro * ro * len) - (Math.PI * ri * ri * len);
}

const drop = document.getElementById("drop");
const out = document.getElementById("out");
const fileDiv = document.getElementById("file");

drop.ondragover = e => e.preventDefault();

// 🚀 FIXED DROP FUNCTION
drop.ondrop = async (e) => {
  e.preventDefault();

  try {
    const file = e.dataTransfer.files[0];
    if (!file) return;

    fileName = file.name;
    fileDiv.innerText = "Loaded: " + file.name;

    if (file.size === 0) {
      out.textContent = "ERROR: PDF is empty (0 bytes)";
      return;
    }

    const buffer = await file.arrayBuffer();

    // 🔥 SAFE PDF LOAD
    const pdf = await pdfjsLib.getDocument({
      data: buffer,
      disableWorker: true
    }).promise;

    let text = "";

    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const content = await page.getTextContent();

      text += content.items.map(item => item.str).join(" ");
    }

    if (!text) {
      out.textContent = "⚠️ No readable text in PDF (likely scanned image)";
      return;
    }

    const lower = text.toLowerCase();

    // 🔥 REAL DETECTION
    window.detected = {

      threads:
        (lower.match(/thread/g) || []).length +
        (lower.match(/acme/g) || []).length +
        (lower.match(/stub/g) || []).length +
        (lower.match(/unc/g) || []).length +
        (lower.match(/unf/g) || []).length,

      acme: lower.includes("acme"),
      stub: lower.includes("stub"),
      box: lower.includes("box"),

      holes:
        (lower.match(/hole/g) || []).length +
        (lower.match(/drill/g) || []).length +
        (lower.match(/bore/g) || []).length +
        (lower.match(/thru/g) || []).length,

      unthreaded: lower.includes("unthreaded"),

      tolerance:
        lower.includes("±") ||
        lower.includes("+/-") ||
        lower.includes(".00")
    };

    calculate();

  } catch (err) {
    out.textContent = "PDF ERROR: " + err.message;
  }
};

// CALCULATION
function calculate(){

  if(!fileName) return;

  const holes = window.detected?.holes || 0;
  const threads = window.detected?.threads || 0;
  const acme = window.detected?.acme;
  const stub = window.detected?.stub;
  const box = window.detected?.box;
  const tolerance = window.detected?.tolerance;
  const unthreaded = window.detected?.unthreaded;

  const qty = +document.getElementById("qty").value;
  const matCost = +document.getElementById("matCost").value;

  const od = +document.getElementById("od").value;
  const id = +document.getElementById("id").value;
  const len = +document.getElementById("length").value;

  const vol = volumeRemoved(od,id,len);

  let lathe = 0.3 + vol * 0.02;

  if(threads) lathe += threads * 0.08;
  if(acme) lathe += 1.0;
  if(stub) lathe += 0.5;
  if(box) lathe += 0.4;
  if(tolerance) lathe += 0.3;

  let mill = 0.5 + holes * 0.04;
  if(unthreaded) mill += 0.2;

  const prog = 1.2;

  const price =
    lathe * LATHE_RATE +
    mill * MILL_RATE +
    (prog / qty) * PROGRAM_RATE +
    matCost;

  const total = price * qty;

  out.textContent =
    "File: " + fileName + "\n\n" +

    "Holes: " + holes + "\n" +
    "Threads: " + threads + "\n" +
    "ACME: " + (acme ? "YES" : "NO") + "\n" +
    "Stub: " + (stub ? "YES" : "NO") + "\n" +
    "Box: " + (box ? "YES" : "NO") + "\n" +
    "Unthreaded: " + (unthreaded ? "YES" : "NO") + "\n\n" +

    "Lathe Time: " + lathe.toFixed(2) + " hrs\n" +
    "Mill Time: " + mill.toFixed(2) + " hrs\n\n" +

    "Material Cost: $" + matCost.toFixed(2) + "\n\n" +

    "Price/Part: $" + price.toFixed(2) + "\n" +
    "Total: $" + total.toFixed(2);
}

// AUTO UPDATE
document.querySelectorAll("input").forEach(el => {
  el.oninput = calculate;
});
</script>

</body>
</html>
