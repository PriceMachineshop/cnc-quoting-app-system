<!DOCTYPE html>
<html>
<head>
  <title>CNC Quote OCR System</title>
</head>
<body>

<h2>CNC Quote System (OCR Only - Stable)</h2>

<div id="drop" style="border:3px dashed green;padding:30px;">
  📄 DROP PDF HERE
</div>

<div id="file"></div>

<br>

<pre id="out"></pre>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>

<script>
const drop = document.getElementById("drop");
const out = document.getElementById("out");
const fileDiv = document.getElementById("file");

drop.ondragover = (e) => {
  e.preventDefault();
  drop.style.background = "#ddd";
};

drop.ondragleave = () => {
  drop.style.background = "";
};

drop.ondrop = async (e) => {
  e.preventDefault();
  drop.style.background = "";

  out.textContent = "DROP DETECTED\n";

  const file = e.dataTransfer.files[0];

  if (!file) {
    out.textContent += "❌ No file\n";
    return;
  }

  fileDiv.innerText = "Loaded: " + file.name;

  try {
    out.textContent += "Running OCR directly on file...\n";

    const result = await Tesseract.recognize(
      file,
      "eng",
      {
        logger: m => {
          if (m.status === "recognizing text") {
            out.textContent = "OCR Progress: " + Math.round(m.progress * 100) + "%";
          }
        }
      }
    );

    const text = result.data.text;
    const lower = text.toLowerCase();

    out.textContent = "\n--- OCR TEXT ---\n" + text;

    // 🔥 DETECTION
    let threads = 0;
    let holes = 0;

    threads += (lower.match(/unc/g) || []).length;
    threads += (lower.match(/unf/g) || []).length;
    threads += (lower.match(/acme/g) || []).length;
    threads += (lower.match(/stub/g) || []).length;
    threads += (lower.match(/tap/g) || []).length;

    holes += (lower.match(/drill/g) || []).length;
    holes += (lower.match(/bore/g) || []).length;
    holes += (lower.match(/thru/g) || []).length;

    out.textContent += "\n\n--- DETECTED ---\n";
    out.textContent += "Threads: " + threads + "\n";
    out.textContent += "Holes: " + holes + "\n";
    out.textContent += "ACME: " + (lower.includes("acme") ? "YES" : "NO") + "\n";
    out.textContent += "Stub: " + (lower.includes("stub") ? "YES" : "NO") + "\n";
    out.textContent += "Box: " + (lower.includes("box") ? "YES" : "NO") + "\n";

  } catch (err) {
    out.textContent = "❌ ERROR:\n" + err.message;
  }
};
</script>

</body>
</html>
