<!DOCTYPE html>
<html>
<body>

<h2>CNC Quote System</h2>

<input type="file" id="file"><br><br>

Qty: <input id="qty" value="10"><br>
Material ($/part): <input id="mat" value="25"><br><br>

<pre id="out"></pre>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>

<script>
document.getElementById("file").onchange = function(e){

  const file = e.target.files[0];
  const out = document.getElementById("out");

  if(!file){
    out.textContent = "No file selected";
    return;
  }

  out.textContent = "Reading file...\n";

  Tesseract.recognize(file, "eng", {
  logger: m => {
    document.getElementById("out").textContent =
      "OCR Progress: " + Math.round((m.progress || 0)*100) + "%\n";
  }
}).then(result => {

    const text = result.data.text.toLowerCase();

    let threads = (text.match(/thread|unc|unf|acme/g) || []).length;
    let holes = (text.match(/drill|hole|bore/g) || []).length;

    let qty = +document.getElementById("qty").value;
    let mat = +document.getElementById("mat").value;

    let lathe = 0.5 + threads * 0.2;
    let mill = 0.5 + holes * 0.1;

    let price = lathe*120 + mill*120 + mat;
    let total = price * qty;

    out.textContent =
      "Threads: " + threads + "\n" +
      "Holes: " + holes + "\n\n" +
      "Price: $" + price.toFixed(2) + "\n" +
      "Total: $" + total.toFixed(2) + "\n\n" +
      "----- TEXT -----\n" + text;

  });

}
</script>

</body>
</html>
